<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>(function(){var t=localStorage.getItem('ow-theme')||'system';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t})()</script>
<title>ownwatch</title>
<style>
/* Fonts: IBM Plex Mono if installed, else the system monospace. No remote font loading (local-first). */
:root{color-scheme:dark;--bg:#0e0a16;--panel:#150f20;--panel2:#1d1530;--line:#35294f;--fg:#ece4ff;--mut:#a99bc9;--acc:#b388ff;--accfg:#12081f;--ok:#7ee2b8;--warn:#ffc857;--bad:#ff6b8b;--badfg:#1f0510;--sel:#221a38;--hh:65px;--scrim:rgba(0,0,0,.6);--font:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
:root[data-theme=light]{color-scheme:light;--bg:#f7f5fb;--panel:#ffffff;--panel2:#efeaf8;--line:#d8cfe8;--fg:#1d1530;--mut:#5f5478;--acc:#6d3fd1;--accfg:#ffffff;--ok:#0f7a55;--warn:#8a5a00;--bad:#c0254f;--badfg:#ffffff;--sel:#ede6fa;--scrim:rgba(20,10,40,.35)}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 220px;max-width:236px;min-width:200px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
@media(min-width:861px){.side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}} /* nav stays put while the page scrolls */
.main{flex:999 1 560px;min-width:0;padding:20px 28px 60px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;padding:0 8px}
.logo{width:18px;height:18px;border:2px solid var(--acc);position:relative}.logo:after{content:"";position:absolute;inset:3px;background:var(--acc)}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:0;background:transparent;color:var(--mut);text-align:left;font-size:14px}
.nav:hover{background:var(--sel);color:var(--fg)}.nav.on{background:var(--sel);color:var(--fg);box-shadow:inset 2px 0 0 var(--acc)}
.grow{flex:1 1 auto;min-width:0}
.badge{font-size:11px;min-width:22px;text-align:center;padding:2px 6px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.badge.warn{color:var(--warn);border-color:var(--warn)}.badge.bad{color:var(--bad);border-color:var(--bad)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);margin:-20px -28px 0;padding:14px 28px;min-height:var(--hh);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px;font-weight:600}
.search{height:36px;width:280px;max-width:100%;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px}
.search::placeholder{color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line)}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;background:var(--panel);border:1px solid var(--line)}
.tile:hover{border-color:var(--acc)}.tile .v{font-size:28px;font-weight:600;line-height:1.1}.tile .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.tile .s{font-size:12px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:var(--bad);color:var(--badfg)}
.btn.solid{background:var(--bad);color:var(--badfg);border-color:var(--bad)}.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed}.btn[disabled]:hover{border-color:var(--line)}
.sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px;font-weight:500}
.sev{width:9px;height:9px;flex:none;margin-top:5px}.sev.high{background:var(--bad)}.sev.medium{background:var(--warn)}.sev.low{background:var(--mut)}
.item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item h3{margin:0 0 2px;font-size:14px;font-weight:600}.item p{margin:0;font-size:13px;color:var(--mut);line-height:1.45}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;font-size:12px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.tag.warn{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.tag.bad{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tbl{overflow-x:auto}
.pager{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.sel{position:relative;display:inline-block}
.sel-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;min-width:72px;height:28px;padding:0 8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:12px}
.sel-btn:hover,.sel-btn[aria-expanded=true]{border-color:var(--acc)}
.sel-btn .caret{color:var(--mut);font-size:10px}
.sel-menu{position:absolute;bottom:calc(100% + 4px);left:0;min-width:100%;z-index:20;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--acc);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.sel-opt{height:32px;padding:0 12px;border:0;background:transparent;color:var(--fg);font-size:12px;text-align:left;white-space:nowrap}
.sel-opt:hover,.sel-opt:focus-visible{background:var(--sel);outline:none}
.sel-opt.on{color:var(--acc);box-shadow:inset 2px 0 0 var(--acc)}
.theme-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* Wide screens: tables scroll with the page, so column headers can stick under the page header. */
@media(min-width:1101px){.tbl{overflow-x:clip}.tr{min-width:0}.tr.h{position:sticky;top:var(--hh);z-index:2;background:var(--panel)}}
.tr{display:grid;grid-template-columns:minmax(0,1.6fr) 56px 56px minmax(0,1.4fr) minmax(0,1.2fr) 96px;gap:12px;align-items:center;min-height:46px;padding:0 16px;width:100%;min-width:760px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:13px}
.tr.h{min-height:36px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;cursor:default}
button.tr:hover{background:var(--sel)}button.tr.on{background:var(--sel);box-shadow:inset 2px 0 0 var(--acc)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tr.ell{min-width:0}.tr.ell>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{height:30px;padding:0 12px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:13px}.chip:hover{color:var(--fg)}.chip.on{background:var(--sel);color:var(--fg);border-color:var(--acc)}
.drawer{flex:1 1 380px;max-width:460px;min-width:320px;position:relative;z-index:3}
@media(min-width:1101px){.drawer{position:sticky;top:calc(var(--hh) + 16px);align-self:flex-start;max-height:calc(100vh - var(--hh) - 32px);overflow-y:auto}}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:13px;padding:14px 16px;margin:0;border-top:1px solid var(--line)}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-all}
.pr{display:grid;grid-template-columns:62px minmax(0,1fr) 54px 64px 64px;gap:8px;align-items:center;min-height:42px;padding:0 16px;border-top:1px solid var(--line);font-size:13px}
.bar{height:6px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{width:480px;max-width:100%;background:var(--panel);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal h2{margin:0;font-size:17px}
.code{font-size:12px;background:var(--bg);border:1px solid var(--line);padding:8px 10px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--acc);padding:10px 12px 10px 16px;font-size:13px;z-index:11;max-width:calc(100% - 32px)}
.mut{color:var(--mut)}.small{font-size:12px}
</style>
</head>
<body>
<div class="shell">
<nav class="side" aria-label="Sections"><div class="brand"><span class="logo"></span><span>ownwatch</span></div><div id="nav" style="display:flex;flex-direction:column;gap:2px"></div><div class="grow"></div>
<div id="theme" style="padding:0 8px"></div>
<div class="small mut" style="padding:0 8px;display:flex;flex-direction:column;gap:6px"><div id="live">connecting...</div><div>127.0.0.1, local only</div></div></nav>
<main class="main">
<header class="top"><h1 id="title">Overview</h1><div class="grow"></div><input id="q" class="search" type="search" placeholder="Search apps, ports" aria-label="Search apps and ports"></header>
<div id="content"></div>
</main>
</div>
<div id="layer"></div>
<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const e = tag === 'svg' ? document.createElementNS('http://www.w3.org/2000/svg', 'svg') : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v); else e.setAttribute(k, v === true ? '' : v);
  }
  e.append(...kids.flat(Infinity).filter((c) => c != null && c !== false).map((c) => (c instanceof Node ? c : document.createTextNode(String(c)))));
  return e;
};
const S = { view: 'overview', sel: null, filter: 'all', lfilter: 'all', q: '', page: {}, size: 25, menu: null, theme: localStorage.getItem('ow-theme') || 'system', modal: null, toast: null, snap: null, priv: [], sudo: [], muted: new Set(JSON.parse(localStorage.getItem('ow-muted') || '[]')) };
const base = (p) => String(p).split('/').pop();
const net = (g) => g.conns.some((c) => c.scope !== 'loopback');
const apple = (g) => !!(g.signing && g.signing.apple);
const status = (g) => (g.approved ? 'approved' : apple(g) ? 'macOS' : net(g) ? 'review' : 'idle');
const tagOf = (s) => ({ review: 'warn', approved: 'ok' }[s] || '');
const rec = (m) => { Object.assign(S, m); render(); };
// Background polls must not rebuild the DOM under an open menu or dialog.
const quiet = (m) => { Object.assign(S, m); if (!S.menu && !S.modal) render(); };
const media = matchMedia('(prefers-color-scheme: light)');
const applyTheme = () => { document.documentElement.dataset.theme = S.theme === 'system' ? (media.matches ? 'light' : 'dark') : S.theme; };
const setTheme = (t) => { localStorage.setItem('ow-theme', t); S.theme = t; applyTheme(); render(); };
media.addEventListener('change', applyTheme);

/* Custom select: button + listbox. Arrow keys move, Enter/Space picks, Escape closes and returns focus. */
function menuKeys(e) {
  const items = [...e.currentTarget.querySelectorAll('.sel-opt')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[Math.max(i - 1, 0)].focus(); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); const k = S.menu; rec({ menu: null }); const t = document.querySelector('[data-trigger="' + k + '"]'); if (t) t.focus(); }
  else if (e.key === 'Tab') { S.menu = null; render(); }
}
function dropdown(key, value, options, onPick, label) {
  const open = S.menu === key, cur = options.find((o) => o[0] === value) || options[0];
  return h('div', { class: 'sel' },
    h('button', { class: 'sel-btn', type: 'button', 'aria-haspopup': 'listbox', 'aria-expanded': String(open), 'aria-label': label + ': ' + cur[1], 'data-trigger': key, onClick: (e) => { e.stopPropagation(); rec({ menu: open ? null : key }); } }, h('span', {}, cur[1]), h('span', { class: 'caret', 'aria-hidden': 'true' }, '\u25BE')),
    open ? h('div', { class: 'sel-menu', role: 'listbox', 'aria-label': label, onKeydown: menuKeys },
      options.map(([v, text]) => h('button', { class: 'sel-opt' + (v === value ? ' on' : ''), type: 'button', role: 'option', 'aria-selected': String(v === value), 'data-autofocus': v === value ? '' : null, onClick: (e) => { e.stopPropagation(); S.menu = null; onPick(v); } }, text))) : null);
}
function paginate(list, key) {
  const pages = Math.max(1, Math.ceil(list.length / S.size));
  const p = Math.min(Math.max(1, S.page[key] || 1), pages);
  const start = (p - 1) * S.size;
  const slice = list.slice(start, start + S.size);
  const go = (n) => rec({ page: Object.assign({}, S.page, { [key]: n }) });
  const pager = list.length <= 10 ? null : h('div', { class: 'pager' },
    h('span', {}, (start + 1) + '-' + (start + slice.length) + ' of ' + list.length), h('span', { class: 'grow' }),
    h('span', { class: 'theme-row' }, 'Rows', dropdown('rows', S.size, [10, 25, 50, 100].map((n) => [n, String(n)]), (n) => rec({ size: n, page: {} }), 'Rows per page')),
    h('button', { class: 'btn sm', disabled: p <= 1, onClick: () => go(p - 1) }, 'Prev'), h('span', {}, 'Page ' + p + ' / ' + pages),
    h('button', { class: 'btn sm', disabled: p >= pages, onClick: () => go(p + 1) }, 'Next'));
  return { slice, pager };
}

async function api(path, method = 'GET') {
  const r = await fetch(path, { method, headers: { 'X-Ownwatch-Token': TOKEN } });
  if (!r.ok) throw new Error(await r.text());
  return r;
}
async function load(fresh) {
  try { quiet({ snap: await (await api('/api/snapshot' + (fresh ? '?fresh=1' : ''))).json() }); $('live').textContent = 'live, refreshed ' + new Date().toLocaleTimeString(); }
  catch (e) { $('live').textContent = 'offline: ' + e.message; }
}
const loadPriv = async () => { try { quiet({ priv: (await (await api('/api/privilege')).json()) || [] }); } catch (e) {} };
const loadSudo = async () => { try { quiet({ sudo: (await (await api('/api/sudo')).json()) || [] }); } catch (e) {} };
const toast = (t) => rec({ toast: t });
const mute = (id) => { S.muted.add(id); localStorage.setItem('ow-muted', JSON.stringify([...S.muted])); toast('Muted. It stays visible in its own section.'); };
async function approve(g) { try { await api('/api/approve?key=' + encodeURIComponent(g.key), 'POST'); toast('Approved ' + g.label + '. It is now part of your baseline.'); await load(true); } catch (e) { toast('Could not approve: ' + e.message); } }
async function stop(sig) {
  const m = S.modal; rec({ modal: null });
  try {
    const o = await (await api('/api/kill?sig=' + sig + '&pids=' + m.pids.join(','), 'POST')).json();
    toast('Sent SIG' + sig + ' to ' + o.sent.length + ' process(es) of ' + m.label + (o.refused.length ? '. Refused ' + o.refused.length + ': ' + o.refused[0].reason : '.'));
    setTimeout(() => load(true), 700);
  } catch (e) { toast('Stop failed: ' + e.message); }
}
const askStop = (label, procs) => rec({ modal: { label, pids: procs.map((p) => p.pid), count: procs.length } });

function cards() {
  const g = S.snap.groups, f = S.snap.findings, out = [];
  const grp = (label) => g.find((x) => x.label === label);
  const add = (c) => { if (!S.muted.has(c.id)) out.push(c); };
  for (const x of f) {
    const G = grp(x.group);
    if (x.rule === 'exposed-listener' && G) add({ id: 'exp:' + G.key, sev: 'high', title: G.label + ' listens on ports open to your network', sub: x.detail + '. Anyone on your Wi-Fi can reach these.', acts: [!G.approved && ['Approve ' + G.label, 'pri', () => approve(G)], ['Details', '', () => rec({ view: 'apps', sel: G.key })]] });
    if (x.rule === 'debug-port' && G) add({ id: 'dbg:' + G.key, sev: 'high', title: G.label + ' has its debug port open', sub: x.detail, acts: [['Quit ' + G.label + '...', 'danger', () => askStop(G.label, G.procs.filter((p) => p.user !== 'root'))], ['Details', '', () => rec({ view: 'apps', sel: G.key })]] });
    if (x.rule === 'unsigned-network' && G) add({ id: 'uns:' + G.key, sev: 'high', title: G.label + ' is unsigned and uses the network', sub: x.detail, acts: [['Details', 'pri', () => rec({ view: 'apps', sel: G.key })]] });
    if (x.rule === 'new-remote' && G) add({ id: 'new:' + G.key + x.detail, sev: 'medium', title: G.label + ' contacted new hosts', sub: x.detail, acts: [['Details', 'pri', () => rec({ view: 'apps', sel: G.key })], ['Mute', '', () => mute('new:' + G.key + x.detail)]] });
  }
  const pending = g.filter((x) => status(x) === 'review');
  if (pending.length) add({ id: 'review', sev: 'medium', title: pending.length + ' apps use the network but are not approved', sub: pending.map((x) => x.label).join(', '), acts: [['Review apps', 'pri', () => rec({ view: 'apps', filter: 'review' })]] });
  const failed = S.priv.filter((e) => !e.ok && e.client.endsWith('/sudo')).length;
  if (failed >= 5) add({ id: 'sudo', sev: 'medium', title: failed + ' failed sudo attempts in the last 2 hours', sub: 'Repeated failures like this are usually a script retrying. Check who ran them.', acts: [['Investigate', 'pri', () => rec({ view: 'priv' })], ['Mark as mine', '', () => mute('sudo')]] });
  const ap = f.filter((x) => x.rule === 'exposed-listener-apple');
  if (ap.length) add({ id: 'apple', sev: 'low', title: 'Apple services reachable from your network', sub: ap.map((x) => x.group).join(', ') + '. These are part of macOS.', acts: [['Mute', '', () => mute('apple')]] });
  return out;
}

function overview() {
  const s = S.snap, g = s.groups, c = cards();
  const review = g.filter((x) => status(x) === 'review').length;
  const lan = g.reduce((n, x) => n + new Set(x.conns.filter((k) => k.exposed).map((k) => k.local_port)).size, 0);
  const failed = S.priv.filter((e) => !e.ok && e.client.endsWith('/sudo')).length;
  const tile = (l, v, sub, go, col) => h('button', { class: 'tile', onClick: go }, h('span', { class: 'l' }, l), h('span', { class: 'v', style: col ? 'color:var(--' + col + ')' : '' }, v), h('span', { class: 's' }, sub));
  const talk = g.filter((x) => x.conns.some((k) => k.direction === 'outbound')).map((x) => [x.label, x.conns.filter((k) => k.direction === 'outbound').length]).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const max = talk.length ? talk[0][1] : 1;
  return [
    h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px' },
      tile('Needs review', review, 'apps not yet approved', () => rec({ view: 'apps', filter: 'review' }), review ? 'warn' : 'ok'),
      tile('Open to LAN', lan, 'ports on all interfaces', () => rec({ view: 'apps' })),
      tile('Failed sudo', failed, 'last 2 hours', () => rec({ view: 'priv' }), failed ? 'bad' : ''),
      tile('Outbound', s.totals.outbound, 'sockets right now', () => rec({ view: 'apps' }))),
    h('div', { style: 'display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-top:20px' },
      h('section', { style: 'flex:999 1 520px;min-width:0' }, h('h2', { class: 'sec' }, 'Needs your attention'),
        h('div', { class: 'card' }, c.length ? c.map((x) => h('div', { class: 'item' }, h('span', { class: 'sev ' + x.sev, title: x.sev }),
          h('div', { class: 'grow' }, h('h3', {}, x.title), h('p', {}, x.sub), h('div', { style: 'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap' }, x.acts.filter(Boolean).map((a) => h('button', { class: 'btn sm ' + a[1], onClick: a[2] }, a[0])))),
          h('span', { class: 'tag ' + ({ high: 'bad', medium: 'warn' }[x.sev] || ''), style: 'align-self:flex-start' }, x.sev))) : h('div', { class: 'item' }, h('p', {}, 'Nothing needs attention. Everything on this Mac is accounted for.')))),
      h('section', { style: 'flex:1 1 300px;min-width:0' }, h('h2', { class: 'sec' }, 'Top talkers (outbound sockets)'),
        h('div', { class: 'card', style: 'padding:6px 16px' }, talk.map((t) => h('div', { style: 'padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px' },
          h('div', { style: 'display:flex;justify-content:space-between;font-size:13px' }, h('span', {}, t[0]), h('span', { class: 'mut' }, t[1])), h('div', { class: 'bar' }, h('i', { style: 'width:' + Math.round(t[1] / max * 100) + '%' }))))))),
  ];
}

function apps() {
  const q = S.q.toLowerCase();
  const all = S.snap.groups.filter((g) => g.conns.length);
  const list = all.filter((g) => (S.filter === 'all' || status(g) === S.filter) && (!q || g.label.toLowerCase().includes(q) || g.conns.some((c) => String(c.local_port).includes(q) || (c.remote_addr || '').includes(q))));
