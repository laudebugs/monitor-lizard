[package]
name = "ownwatch"
version = "0.1.0"
edition = "2021"
description = "Local-first macOS security monitor: is everything on this machine mine?"

[dependencies]
libproc = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
lto = true
strip = true
