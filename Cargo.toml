[package]
name = "sys-monitor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first macOS security monitor: is everything on this machine mine?"

[dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
io-kit-sys = "0.5.0"
libc = "0.2.191"
libproc = "0.15.0"
mach2 = "0.7.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }

[profile.release]
lto = true
strip = true
